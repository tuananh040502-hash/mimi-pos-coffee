    function openEditOrderModal(orderId) {
      const target = orders.find(o => o.id === orderId);

      document.getElementById('edit-order-id').value = target.id;
      document.getElementById('edit-order-code-label').textContent = `(${target.orderCode || ''})`;
      document.getElementById('edit-order-customer').value = target.customer || '';
      document.getElementById('edit-order-discount').value = target.discount || 0;
      document.getElementById('edit-order-note').value = target.note || '';

      editingOrderItems = (target.items || []).map(i => ({ ...i }));

      const addSelect = document.getElementById('edit-order-add-drink-select');
      addSelect.innerHTML = menuItems.map(m => `<option value="${m.id}">${m.name} (${formatVND(m.price)})</option>`).join('');

      renderEditingOrderItems();
      document.getElementById('edit-order-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function renderEditingOrderItems() {
      const container = document.getElementById('edit-order-items-list');
      const discount = Number(document.getElementById('edit-order-discount').value || 0);

      if (editingOrderItems.length === 0) {
        container.innerHTML = `<div class="text-center py-4 text-xs text-rose-500 font-bold">Đơn hàng cần ít nhất 1 món!</div>`;
      } else {
        container.innerHTML = editingOrderItems.map((it, idx) => `
          <div class="flex items-center justify-between gap-2 bg-white dark:bg-slate-900 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
            <div class="min-w-0 flex-1">
              <div class="text-xs font-extrabold text-slate-800 dark:text-slate-100 truncate">${it.name}</div>
              <input
                type="text"
                data-edit-item-note="${idx}"
                value="${it.itemNote || ''}"
                placeholder="Ghi chú món..."
                class="edit-item-note-input mt-1 w-full px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-[11px]"
              />
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" data-edit-idx="${idx}" data-edit-act="dec" class="edit-item-qty-btn w-6 h-6 rounded-lg border border-slate-200 dark:border-slate-700 font-bold text-xs">-</button>
              <span class="w-5 text-center text-xs font-extrabold">${it.qty}</span>
              <button type="button" data-edit-idx="${idx}" data-edit-act="inc" class="edit-item-qty-btn w-6 h-6 rounded-lg bg-cobalt-600 text-white font-bold text-xs">+</button>
            </div>
          </div>
        `).join('');
      }

      const subtotal = editingOrderItems.reduce((s, i) => s + Number(i.price) * Number(i.qty), 0);
      const total = Math.max(0, subtotal - discount);
      document.getElementById('edit-order-total-preview').textContent = formatVND(total);

      container.querySelectorAll('.edit-item-qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-edit-idx'));
          const act = btn.getAttribute('data-edit-act');
          if (act === 'inc') editingOrderItems[idx].qty += 1;
          else {
            editingOrderItems[idx].qty -= 1;
            if (editingOrderItems[idx].qty <= 0) editingOrderItems.splice(idx, 1);
          }
          renderEditingOrderItems();
        });
      });

      container.querySelectorAll('.edit-item-note-input').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const idx = Number(inp.getAttribute('data-edit-item-note'));
          if (editingOrderItems[idx]) editingOrderItems[idx].itemNote = e.target.value;
        });
      });
    }
